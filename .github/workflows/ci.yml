name: CI

on:
  push:
    branches: [ master, 1.x ]
  pull_request:
    branches: [ master, 1.x ]

# Least privilege by default rather than whatever the repository setting happens to
# be. Nothing here writes to the repo or calls the API; both jobs only need the
# checkout. Fork pull requests already get a read-only token, so this closes the
# same-repo branch-push case.
permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} — phpcs + phpunit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.4' ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # install, not update: composer.lock is committed, and `composer update` here
      # ignored it - so CI resolved a fresh dependency set on every run and never
      # actually tested the pinned one, while any newly published version of a dev
      # dependency (or a transitive Composer plugin, which executes code) ran in CI
      # on first publish. The JS job has always used `npm ci` for exactly this reason.
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: PHP_CodeSniffer (includes PHP 8.0 compatibility sniffs)
        run: vendor/bin/phpcs

      - name: PHPUnit
        run: vendor/bin/phpunit

  js:
    name: JS — build + lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # The postbuild npm hook runs lint:js automatically after every build.
      - name: Build + lint JS
        run: npm run build

      - name: JS unit tests
        run: npm run test:unit
